name: Build NFAuth APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip NFAuth-Android-Source.zip -d android-project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build test APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NFAuth-test-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
